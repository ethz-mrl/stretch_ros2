version: '3.8'

services:
  stretch-simulation: 
    image: stretch-simulation:latest
    container_name: stretch-sim
    build:
      context: .
      ssh:
        - default
      dockerfile: Dockerfile
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    shm_size: '2gb'
    environment: 
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - AMENT_TRACE_SETUP_FILES=
      - STRETCH_MUJOCO_EDITABLE_INSTALL=${STRETCH_MUJOCO_EDITABLE_INSTALL:-0}
    volumes:
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      # Mount local source code for development
      - ./:/root/ament_ws/src/stretch_ros2/stretch_simulation:rw
      - ../stretch_nav2/:/root/ament_ws/src/stretch_ros2/stretch_nav2:rw
      # Set STRETCH_MUJOCO_HOST_DIR in your shell or .env to your local stretch_mujoco path
      - ${STRETCH_MUJOCO_HOST_DIR}:/root/repos/stretch_mujoco:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - bash
      - -c
      - terminator -u --title="Task Container"